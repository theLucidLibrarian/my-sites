<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thing That You Tell The Time With</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- TOP PANEL -->
    <div id="top-panel">
        <a id="home-link" href="../">HOME</a>
        <div id="dashboard">
            <div class="dash-item">
                <div class="label">System Time</div>
                <div id="live-time">00:00:00</div>
                <div id="live-date">YYYY-MM-DD</div>
            </div>
            <div id="schedule-summary">
                <div class="dash-item">
                    <div class="label">Current Block</div>
                    <button id="current-period" class="summary-popout-trigger" type="button" title="Open or close the countdown pop-out">OFFLINE</button>
                </div>
                <div class="dash-item" id="next-block-item">
                    <div class="label">Next Block</div>
                    <button id="next-period" class="summary-popout-trigger" type="button" title="Open or close the countdown pop-out">NONE</button>
                </div>
                <div class="dash-item">
                    <div class="label">Time Remaining</div>
                    <div class="countdown-row">
                        <button id="countdown" class="summary-popout-trigger" type="button" title="Open or close the countdown pop-out">--:--:--</button>
                        <button id="btn-popout" type="button" aria-label="Pop out countdown and next period"
                                title="Open an always-on-top countdown window">POP OUT</button>
                    </div>
                    <span id="popout-status" role="status" aria-live="polite"></span>
                </div>
            </div>
        </div>

        <div id="controls">
            <div id="schedule-controls">
                <div class="setting-row">
                    <div class="label">Min Day</div>
                    <button id="btn-min-day" type="button" class="min-day-button"
                            aria-label="Minimum day schedule" aria-pressed="false"
                            title="Toggle minimum day schedule">MIN</button>
                </div>
                <div class="setting-row">
                    <div class="label">Week</div>
                    <div class="week-switch" role="radiogroup" aria-label="Schedule week">
                        <input type="radio" id="btn-a-week" name="schedule-week" value="A">
                        <label for="btn-a-week">A</label>
                        <input type="radio" id="btn-b-week" name="schedule-week" value="B">
                        <label for="btn-b-week">B</label>
                    </div>
                </div>
                <div class="setting-row" id="day-override-group">
                    <label class="label" for="day-override-button">Day</label>
                    <div class="day-picker" id="day-override-picker">
                        <button id="day-override-button" type="button" aria-label="Day override"
                                aria-haspopup="listbox" aria-expanded="false"
                                aria-controls="day-override-options">
                            <span id="day-override-value">AUTO</span>
                        </button>
                        <div id="day-override-options" role="listbox" aria-label="Day override options" hidden>
                            <button class="day-override-option" type="button" role="option"
                                    data-value="-1" aria-selected="true" tabindex="-1">AUTO</button>
                            <button class="day-override-option" type="button" role="option"
                                    data-value="1" aria-label="Monday and Friday" aria-selected="false"
                                    tabindex="-1">M/F</button>
                            <button class="day-override-option" type="button" role="option"
                                    data-value="2" aria-selected="false" tabindex="-1">TUE</button>
                            <button class="day-override-option" type="button" role="option"
                                    data-value="3" aria-selected="false" tabindex="-1">WED</button>
                            <button class="day-override-option" type="button" role="option"
                                    data-value="4" aria-selected="false" tabindex="-1">THU</button>
                        </div>
                    </div>
                    <select id="day-override" aria-label="Day override" aria-hidden="true" tabindex="-1" hidden>
                        <option value="-1">AUTO</option>
                        <option value="1">M/F</option>
                        <option value="2">TUE</option>
                        <option value="3">WED</option>
                        <option value="4">THU</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- WORKSPACE / TIMELINE -->
    <div id="workspace">
        <div id="zoom-controls" aria-label="Schedule zoom controls">
            <button id="focus-playhead" type="button" title="Zoom to 1x and follow the current time" aria-pressed="true">FOCUS</button>
            <label for="zoom-slider">ZOOM</label>
            <input id="zoom-slider" type="range" min="100" max="1600" step="25" value="800"
                   aria-label="Schedule zoom">
            <output id="zoom-value" for="zoom-slider">1x</output>
            <button id="zoom-reset" type="button">RESET</button>
        </div>
        <div id="pan-controls">
            <label for="pan-slider">SCROLL</label>
            <input id="pan-slider" type="range" min="0" max="1000" value="0"
                   aria-label="Scroll schedule horizontally" disabled>
        </div>
        <div id="timeline-viewport">
            <div id="timeline-content">
                <div id="ruler">
                    <!-- Ticks generated by JS -->
                    <div id="ruler-playhead" aria-hidden="true"></div>
                    <div id="boundary-labels" tabindex="0" aria-label="Period boundary times"
                         title="Scroll for more period boundary times">
                        <div id="boundary-label-content"></div>
                    </div>
                </div>
                <div id="track-container">
                    <!-- Blocks rendered by JS -->
                    <div id="playhead">
                        <div id="playhead-time"></div>
                    </div>
                </div>
                <div id="track-resize-handle" role="separator" aria-label="Resize period blocks"
                     aria-orientation="horizontal" aria-valuemin="80" aria-valuenow="80"
                     tabindex="0"></div>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-overlay">
        <div id="modal">
            <h2 id="modal-title">Edit Block</h2>
            <div class="input-group">
                <label class="label">Custom Name</label>
                <input type="text" id="modal-name" placeholder="e.g. AP Calculus">
            </div>
            <div class="input-group">
                <label class="label">Track Color</label>
                <input type="color" id="modal-color">
            </div>
            <div class="modal-actions">
                <button id="btn-reset-block">Reset Default</button>
                <button id="btn-cancel">Cancel</button>
                <button id="btn-save" class="btn-save">Save Track</button>
            </div>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
